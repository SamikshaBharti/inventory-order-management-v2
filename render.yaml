# Optional: Render Blueprint — import this repo on Render for one-click setup
databases:
  - name: stockflow-db
    plan: free
    databaseName: inventory_db
    user: inventory_user

services:
  - type: web
    name: stockflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
